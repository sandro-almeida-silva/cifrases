name: Biome Snapshot

on:
  push:
    branches:
      - "feat/cifrases-core"
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec biome format --write .
      - run: tar -czf biome-formatted.tgz --exclude=node_modules --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: biome-formatted
          path: biome-formatted.tgz
